<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonym | Personal Universe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="logo">ANONYM</div>
        <ul class="nav-links">
            <li class="nav-item active" onclick="switchPage('today')">Today</li>
            <li class="nav-item" onclick="switchPage('finance')">Finance</li>
            <li class="nav-item" onclick="switchPage('discovery')">Knowing Myself</li>
            <li class="nav-item" onclick="switchPage('history')">Archives</li>
        </ul>
    </nav>

    <main class="container">
        <section id="today" class="page active">
            <div class="page-header">
                <h1 class="serif" id="displayDate">My Day</h1>
                <div class="stats-box">
                    <span>Productivity: <b id="progPercent">0%</b></span>
                    <div class="progress-container"><div id="progressBar"></div></div>
                </div>
            </div>

            <div class="split-layout">
                <div class="card">
                    <h2 class="serif">Daily Plans</h2>
                    <div class="input-row">
                        <input type="text" id="todoInput" placeholder="Apa rencana hari ini?">
                        <button onclick="addTodo()">Add</button>
                    </div>
                    <ul id="todoList" class="dynamic-list"></ul>
                </div>

                <div class="card">
                    <h2 class="serif">Private Diary</h2>
                    <div class="toolbar">
                        <button onclick="format('bold')"><b>B</b></button>
                        <button onclick="format('italic')"><i>I</i></button>
                        <input type="color" onchange="format('foreColor', this.value)" title="Font Color">
                        <select onchange="format('fontSize', this.value)">
                            <option value="3">Normal</option>
                            <option value="5">Large</option>
                            <option value="7">Huge</option>
                        </select>
                        <label for="imgInp" class="btn-img">Add Image</label>
                        <input type="file" id="imgInp" hidden accept="image/*" onchange="insertImage(this)">
                    </div>
                    <div id="diaryArea" contenteditable="true" placeholder="Tuliskan ceritamu..."></div>
                    <button class="btn-primary" onclick="saveToArchive('Diary')">Save to Archive</button>
                </div>
            </div>
        </section>

        <section id="finance" class="page">
            <h1 class="serif italic">Money Management</h1>
            <div class="card">
                <div class="input-row">
                    <input type="text" id="finNote" placeholder="Keterangan">
                    <input type="number" id="finAmt" placeholder="Jumlah">
                    <button onclick="addFinance()">Add Data</button>
                </div>
                <ul id="finList" class="dynamic-list"></ul>
                <div class="summary-bar">Total: <span id="totalText">0</span></div>
            </div>
        </section>

        <section id="discovery" class="page">
            <h1 class="serif italic">Knowing Myself</h1>
            <div class="card center">
                <p class="prompt-text">"Apa satu hal yang paling membuatmu bangga hari ini?"</p>
                <textarea id="knowNote" placeholder="Refleksi diri..."></textarea>
                <button class="btn-primary" onclick="saveToArchive('Self Reflection')">Save Reflection</button>
            </div>
        </section>

        <section id="history" class="page">
            <h1 class="serif italic">Saved Archives</h1>
            <div id="archiveFeed" class="feed">
                </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
